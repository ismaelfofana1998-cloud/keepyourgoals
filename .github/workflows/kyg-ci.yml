name: KeepYourGoals frontend checks

on:
  pull_request:
    paths:
      - 'index.html'
      - 'config.js'
      - 'kyg-app.js'
      - 'kyg.css'
      - 'manifest.webmanifest'
      - 'tests/smoke.mjs'
      - 'tests/calendar.mjs'
      - '.github/workflows/kyg-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    name: Syntax and schema binding checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check kyg-app.js
      - name: Static integration smoke
        run: node tests/smoke.mjs
      - name: Calendar behavior tests
        run: node tests/calendar.mjs
